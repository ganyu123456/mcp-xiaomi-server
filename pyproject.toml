[project]
name = "mcp-xiaomi-server"
version = "1.0.0"
description = "MCP Xiaomi Server - Read and control Mijia (米家) WiFi devices locally over LAN for LLM agents"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ganyu" }
]
keywords = ["mcp", "xiaomi", "mijia", "miio", "miot", "smart-home", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "python-miio>=0.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
sse = [
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
mcp-xiaomi-server = "mcp_xiaomi_server.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_xiaomi_server"]
